apiVersion: v1
kind: ServiceAccount
metadata:
  name: grpc-server-sa
  namespace: {{ .ClusterManagerNamespace }}
{{ if gt (len .Labels) 0 }}
  labels:
  {{ range $key, $value := .Labels }}
    "{{ $key }}": "{{ $value }}"
  {{ end }}
{{ end }}
{{ if and .GRPCSPIFFEEnabled (gt (len .GRPCSPIFFEServiceAccountAnnotations) 0) }}
  annotations:
  {{ range $key, $value := .GRPCSPIFFEServiceAccountAnnotations }}
    "{{ $key }}": "{{ $value }}"
  {{ end }}
{{ end }}
