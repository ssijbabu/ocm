apiVersion: v1
kind: ConfigMap
metadata:
  name: grpc-server-spiffe-config
  namespace: {{ .ClusterManagerNamespace }}
{{ if gt (len .Labels) 0 }}
  labels:
  {{ range $key, $value := .Labels }}
    "{{ $key }}": "{{ $value }}"
  {{ end }}
{{ end }}
data:
  config.yaml: |
    {{ .GRPCSPIFFEConfig | indent 4 }}
